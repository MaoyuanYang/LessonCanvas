[project]
name = "lessoncanvas-backend"
version = "0.0.0"
description = "LessonCanvas FastAPI modular monolith and Celery worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "sqlalchemy>=2.0.40",
    "alembic>=1.16",
    "pgvector>=0.4",
    "celery[redis]>=5.5",
    "redis>=6",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.9",
    "pyjwt>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lessoncanvas"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
